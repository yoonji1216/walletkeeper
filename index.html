<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="토스 미니앱 텅장수호자의 이용약관과 개인정보처리방침">
<title>텅장수호자 약관</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#F5F7FA; --surface:#FFFFFF;
  --ink:#191D26; --ink-2:#4C5464; --ink-3:#798396;
  --accent:#2F5FD0; --accent-soft:#E8EEFC;
  --rule:#E0E5EE; --rule-strong:#C8D0DE;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1117; --surface:#161A22;
    --ink:#E7EAF1; --ink-2:#A7AFC0; --ink-3:#798296;
    --accent:#8CAFFF; --accent-soft:#1A2231;
    --rule:#252B37; --rule-strong:#38404F;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1117; --surface:#161A22;
  --ink:#E7EAF1; --ink-2:#A7AFC0; --ink-3:#798296;
  --accent:#8CAFFF; --accent-soft:#1A2231;
  --rule:#252B37; --rule-strong:#38404F;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:'Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  font-size:15px; line-height:1.8; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:38rem; margin:0 auto; padding:5rem 1.5rem 6rem}
.eyebrow{
  font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent); margin:0 0 .9rem;
}
h1{
  font-family:'Gowun Batang','Batang',serif; font-weight:700;
  font-size:clamp(1.9rem,6vw,2.5rem); line-height:1.3; margin:0; text-wrap:balance;
}
.lede{color:var(--ink-2); margin:1rem 0 0; font-size:.95rem}

.docs{list-style:none; padding:0; margin:2.5rem 0 0; display:flex; flex-direction:column; gap:.9rem}
.docs a{
  display:block; text-decoration:none; color:inherit;
  background:var(--surface); border:1px solid var(--rule); border-radius:4px;
  padding:1.15rem 1.3rem;
}
.docs a:hover{border-color:var(--accent)}
.docs .name{font-family:'Gowun Batang','Batang',serif; font-weight:700; font-size:1.1rem; display:block}
.docs .note{color:var(--ink-3); font-size:.85rem; display:block; margin-top:.25rem}

.biz{margin:3rem 0 0; padding:1.4rem 0 0; border-top:1px solid var(--rule-strong)}
.biz dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:.5rem 1.1rem; font-size:.86rem}
.biz dt{color:var(--ink-3); font-size:.8rem; white-space:nowrap}
.biz dd{margin:0; color:var(--ink-2)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">텅장수호자 · walletkeeper</p>
  <h1>약관 및 개인정보처리방침</h1>
  <p class="lede">토스 앱 내 미니앱 &lsquo;텅장수호자&rsquo;의 이용 조건과 개인정보 처리 기준을 담은 문서입니다.</p>

  <ul class="docs">
    <li><a href="./terms.html">
      <span class="name">서비스 이용약관</span>
      <span class="note">이용 조건, 아이템, 기록의 저장과 책임 범위</span>
    </a></li>
    <li><a href="./privacy.html">
      <span class="name">개인정보처리방침</span>
      <span class="note">수집 항목과 이용 목적, 보유 기간, 이용자의 권리</span>
    </a></li>
  </ul>

  <div class="biz">
    <dl>
      <dt>상호</dt><dd>윈코드_와이제이</dd>
      <dt>대표자</dt><dd>신윤지</dd>
      <dt>사업자등록번호</dt><dd>744-05-03698</dd>
    </dl>
  </div>
</div>
</body>
</html>
